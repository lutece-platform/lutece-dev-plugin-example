<#include "project_tabs.html" />
<@tabs tab="project" />

<div class="row" >
    <div class="m-1 col-sm-12">
        <@messages infos=infos />
        <h4>#i18n{example.manage_projects.title}</h4>
        <form method="post" action="jsp/site/Portal.jsp?page=project">
            <button name="view_createProject" class="btn btn-primary pull-right" type="submit">
                <span class="fa fa-plus"></span>
                #i18n{example.manage_projects.buttonAdd}
            </button>
        </form>
        
        <div class="row" >
            <#list project_list as project >
                <div class="m-2 col-xs-12 col-sm-6 col-md-4 col-lg-3">
                    <figure class="text-center">
                        <img class="rounded img-thumbnail" src="${project.imageUrl}">
                        <figcaption class="figure-caption fs-5 text-wrap">${project.name}</figcaption>
                    </figure>
                </div>
            </#list>
        </div>
    </div>
</div>
